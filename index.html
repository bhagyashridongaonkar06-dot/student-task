<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 mt-5">
                <div class="card">
                    <form id="stdForm">
                        <div class="card-body">
                            <div class="form-group">
                                <label for="fname">First Name<span class="text-danger">*</span></label>
                                <input type="text"  required class="form-control" id="fname">

                                <label for="lname">Last Name<span class="text-danger"></span></label>
                                <input type="text" required class="form-control" id="lname">

                                <label for="email">Email<span class="text-danger">*</span></label>
                                <input type="text" required class="form-control" id="email">

                                <label for="contact">Contact<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="contact">
                            </div>

                            <button class="btn btn-primary btn-block" id="addStd">Add Student</button>
                        </div>
                    </form>
                </div>
            </div>


            <div class="col-md-8 mt-5">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-bordered text-center">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>Edit</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>
                            <tbody id="stdList">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>Jhon</td>
                                    <td>Doe</td>
                                    <td>jd@gmail.com</td>
                                    <td>12345</td>
                                    <td><i class="fa-solid fa-pen-to-square text-success"></td>
                                    <td><i class="fa-solid fa-trash text-danger"></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>  
                </div>
            </div>
        </div>
    </div>
    

    <script src="./assets/js/app.js"></script>
</body>
</html>
